<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>倉頡輸入法練習 - 三代倉頡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>倉頡輸入法練習</h1>
        <p class="subtitle">三代倉頡 · 支援電腦及手機</p>
        <button id="theme-toggle" class="theme-toggle" title="切換深色模式">&#9790;</button>
    </header>

    <nav id="main-nav">
        <button class="nav-btn active" data-mode="single">單字練習</button>
        <button class="nav-btn" data-mode="phrase">詞句練習</button>
        <button class="nav-btn" data-mode="speed">快打測試</button>
        <button class="nav-btn" data-mode="blind">盲打練習</button>
        <button class="nav-btn" data-mode="lookup">查碼</button>
        <button class="nav-btn" data-mode="radical">字根表</button>
    </nav>

    <!-- Stats Bar -->
    <div id="stats-bar" class="stats-bar">
        <div class="stat-item">
            <span class="stat-label">正確</span>
            <span class="stat-value" id="stat-correct">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">錯誤</span>
            <span class="stat-value" id="stat-wrong">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">準確率</span>
            <span class="stat-value" id="stat-accuracy">-</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">速度</span>
            <span class="stat-value" id="stat-speed">-</span>
        </div>
        <div class="stat-item timer-item">
            <span class="stat-label">時間</span>
            <span class="stat-value" id="stat-timer">0:00</span>
        </div>
        <div class="stat-item">
            <button id="btn-reset-stats" class="btn-reset" title="重置統計">↻</button>
        </div>
    </div>

    <!-- Single Character Practice -->
    <section id="mode-single" class="mode-section active">
        <div class="practice-controls">
            <label>難度：</label>
            <select id="difficulty-select">
                <option value="common500">常用500字</option>
                <option value="common1000">常用1000字</option>
                <option value="common2000">常用2000字</option>
                <option value="common3000">常用3000字</option>
                <option value="all">全部字</option>
            </select>
            <button id="btn-new-set" class="btn-action">新一組</button>
        </div>
        <div id="single-practice-area" class="practice-area">
            <div class="char-display-wrapper">
                <div class="char-display" id="current-char">字</div>
                <div class="char-info" id="char-info"></div>
            </div>
            <div class="input-area">
                <div class="cangjie-display" id="cangjie-display"></div>
                <input type="text" id="cangjie-input" class="cangjie-input" placeholder="輸入倉頡碼..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
                <div class="input-buttons">
                    <button id="btn-hint" class="btn-secondary">提示</button>
                    <button id="btn-answer" class="btn-secondary">答案</button>
                    <button id="btn-skip" class="btn-secondary">跳過</button>
                </div>
            </div>
            <div class="feedback" id="feedback"></div>
            <div class="char-queue" id="char-queue"></div>
        </div>
    </section>

    <!-- Phrase Practice -->
    <section id="mode-phrase" class="mode-section">
        <div class="practice-controls">
            <label>類別：</label>
            <select id="phrase-category">
                <option value="greetings">日常問候</option>
                <option value="food">飲食相關</option>
                <option value="weather">天氣用語</option>
                <option value="work">工作常用</option>
                <option value="school">學校用語</option>
                <option value="proverbs">常用成語</option>
            </select>
            <button id="btn-new-phrase" class="btn-action">下一句</button>
        </div>
        <div class="practice-area">
            <div class="phrase-display" id="phrase-display"></div>
            <div class="phrase-chars" id="phrase-chars"></div>
            <div class="input-area">
                <div class="cangjie-display" id="phrase-cangjie-display"></div>
                <input type="text" id="phrase-input" class="cangjie-input" placeholder="輸入倉頡碼..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
            </div>
            <div class="feedback" id="phrase-feedback"></div>
        </div>
    </section>

    <!-- Speed Test -->
    <section id="mode-speed" class="mode-section">
        <div class="practice-controls">
            <label>時間：</label>
            <select id="speed-time">
                <option value="60">1分鐘</option>
                <option value="120">2分鐘</option>
                <option value="300">5分鐘</option>
            </select>
            <label>難度：</label>
            <select id="speed-difficulty">
                <option value="common500">常用500字</option>
                <option value="common1000">常用1000字</option>
                <option value="common2000">常用2000字</option>
            </select>
            <button id="btn-start-speed" class="btn-action">開始測試</button>
        </div>
        <div class="practice-area">
            <div class="speed-text" id="speed-text"></div>
            <div class="input-area">
                <div class="cangjie-display" id="speed-cangjie-display"></div>
                <input type="text" id="speed-input" class="cangjie-input" placeholder="按「開始測試」後輸入..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" disabled>
            </div>
            <div class="speed-results" id="speed-results"></div>
        </div>
    </section>

    <!-- Blind Typing -->
    <section id="mode-blind" class="mode-section">
        <div class="practice-controls">
            <label>難度：</label>
            <select id="blind-difficulty">
                <option value="common500">常用500字</option>
                <option value="common1000">常用1000字</option>
                <option value="common2000">常用2000字</option>
            </select>
            <button id="btn-new-blind" class="btn-action">開始</button>
        </div>
        <div class="practice-area">
            <div class="char-display-wrapper">
                <div class="char-display" id="blind-char">字</div>
            </div>
            <div class="input-area">
                <div class="blind-input-display" id="blind-input-display">
                    <span class="blind-dots" id="blind-dots"></span>
                </div>
                <input type="text" id="blind-input" class="cangjie-input blind-hidden-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
                <p class="blind-hint">輸入時不會顯示倉頡碼，按 Enter 確認</p>
            </div>
            <div class="feedback" id="blind-feedback"></div>
        </div>
    </section>

    <!-- Lookup Mode -->
    <section id="mode-lookup" class="mode-section">
        <div class="practice-area">
            <textarea id="lookup-input" class="lookup-input" placeholder="在此貼上或輸入任何中文字句..."></textarea>
            <div class="lookup-actions">
                <button id="btn-lookup" class="btn-action">查碼</button>
                <button id="btn-lookup-clear" class="btn-secondary">清除</button>
                <button id="btn-lookup-practice" class="btn-secondary">用此句練習</button>
            </div>
            <div id="lookup-results" class="lookup-results"></div>
        </div>
    </section>

    <!-- Radical Table -->
    <section id="mode-radical" class="mode-section">
        <div class="radical-table-container">
            <h2>倉頡字母及輔助字形表（三代倉頡）</h2>
            <p class="radical-intro">倉頡輸入法共有 24 個字母，分為四大類。每個字母對應鍵盤上的一個英文字母。</p>
            <div id="radical-table"></div>
            <h3>鍵盤對應表</h3>
            <div id="keyboard-map" class="keyboard-map"></div>
        </div>
    </section>

    <!-- Virtual Cangjie Keyboard -->
    <div id="virtual-keyboard" class="virtual-keyboard">
        <div class="vk-row">
            <button class="vk-key" data-key="q">Q<br><span>手</span></button>
            <button class="vk-key" data-key="w">W<br><span>田</span></button>
            <button class="vk-key" data-key="e">E<br><span>水</span></button>
            <button class="vk-key" data-key="r">R<br><span>口</span></button>
            <button class="vk-key" data-key="t">T<br><span>廿</span></button>
            <button class="vk-key" data-key="y">Y<br><span>卜</span></button>
            <button class="vk-key" data-key="u">U<br><span>山</span></button>
            <button class="vk-key" data-key="i">I<br><span>戈</span></button>
            <button class="vk-key" data-key="o">O<br><span>人</span></button>
            <button class="vk-key" data-key="p">P<br><span>心</span></button>
        </div>
        <div class="vk-row">
            <button class="vk-key" data-key="a">A<br><span>日</span></button>
            <button class="vk-key" data-key="s">S<br><span>尸</span></button>
            <button class="vk-key" data-key="d">D<br><span>木</span></button>
            <button class="vk-key" data-key="f">F<br><span>火</span></button>
            <button class="vk-key" data-key="g">G<br><span>土</span></button>
            <button class="vk-key" data-key="h">H<br><span>竹</span></button>
            <button class="vk-key" data-key="j">J<br><span>十</span></button>
            <button class="vk-key" data-key="k">K<br><span>大</span></button>
            <button class="vk-key" data-key="l">L<br><span>中</span></button>
        </div>
        <div class="vk-row">
            <button class="vk-key vk-key-wide" id="vk-backspace" data-key="backspace">⌫</button>
            <button class="vk-key" data-key="z">Z<br><span>重</span></button>
            <button class="vk-key" data-key="x">X<br><span>難</span></button>
            <button class="vk-key" data-key="c">C<br><span>金</span></button>
            <button class="vk-key" data-key="v">V<br><span>女</span></button>
            <button class="vk-key" data-key="b">B<br><span>月</span></button>
            <button class="vk-key" data-key="n">N<br><span>弓</span></button>
            <button class="vk-key" data-key="m">M<br><span>一</span></button>
            <button class="vk-key vk-key-wide" id="vk-enter" data-key="enter">確認</button>
        </div>
        <div class="vk-row">
            <button class="vk-key vk-space" data-key="space">空格</button>
        </div>
    </div>

    <footer>
        <p>倉頡輸入法練習 · 三代倉頡 · 開源專案</p>
    </footer>

    <script src="cangjie3_data.js"></script>
    <script src="app.js"></script>
</body>
</html>
